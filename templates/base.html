<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Автошкола{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
    <style>
        /* 🔹 КЛЮЧЕВОЕ: Меню СПРАВА */
        body {
            display: flex;
            flex-direction: row-reverse;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        /* 🔹 Кнопка переключения сайдбара */
        .sidebar-toggle-btn {
            position: fixed;
            top: 15px;
            right: 290px; /* Позиция у правого края сайдбара */
            z-index: 1001;
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #475569;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .sidebar-toggle-btn:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        /* Когда сайдбар свёрнут — кнопка смещается */
        body.sidebar-collapsed .sidebar-toggle-btn {
            right: 75px;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            transition: margin-right 0.3s ease;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .page-header h1 {
            margin: 0;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .btn {
            background: white;
            color: #4facfe;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn:hover { background: #f1f5f9; }
        .btn-primary {
            background: #4facfe;
            color: white;
        }
        .btn-primary:hover { background: #3a9bfe; }
        .data-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #64748b;
            font-size: 14px;
        }
        td { color: #334155; }
        tr:hover { background: #f8fafc; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .sidebar-toggle-btn { display: none; }
        }
    </style>
</head>
<body class="sidebar-collapsed">
    <!-- Кнопка переключения сайдбара -->
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Развернуть меню">☰</button>

    {% include 'includes/sidebar.html' %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

    <script>
    // 🔹 Функция переключения сайдбара
    function toggleSidebar() {
        const body = document.body;
        const btn = document.querySelector('.sidebar-toggle-btn');
        body.classList.toggle('sidebar-collapsed');

        const isCollapsed = body.classList.contains('sidebar-collapsed');
        btn.title = isCollapsed ? 'Развернуть меню' : 'Свернуть меню';
        btn.textContent = isCollapsed ? '☰' : '✕';

        // Сохраняем состояние
        localStorage.setItem('sidebarCollapsed', isCollapsed);
    }

    // 🔹 Восстановление состояния при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        const saved = localStorage.getItem('sidebarCollapsed');
        const body = document.body;
        const btn = document.querySelector('.sidebar-toggle-btn');

        // По умолчанию свёрнут (если ничего не сохранено)
        if (saved === null || saved === 'true') {
            body.classList.add('sidebar-collapsed');
            btn.textContent = '☰';
            btn.title = 'Развернуть меню';
        } else {
            body.classList.remove('sidebar-collapsed');
            btn.textContent = '✕';
            btn.title = 'Свернуть меню';
        }
    });
    </script>
</body>
</html>
