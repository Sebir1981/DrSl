{% extends "base.html" %}
{% block title %}🔐 Хранилище — Автошкола{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🔐 Хранилище доступов</h1>
    <div>
        <a href="{% url 'vault:dashboard' %}" class="btn" style="margin-right: 10px; background:#e2e8f0; color:#334155;">← На главную</a>
        <a href="{% url 'admin:vault_vaultentry_add' %}" class="btn btn-primary">+ Добавить запись</a>
    </div>
</div>

<div class="data-table">
    <table>
        <thead>
    <tr>
        <th>ФИО</th>
        <th>Логин</th>
        <th>Действия</th>
    </tr>
</thead>
<tbody>
    {% for entry in entries %}
    <tr>
        <td><strong>{{ entry.full_name|default:"—" }}</strong></td>
        <td>{{ entry.username }}</td>
        <td>
            <a href="{% url 'vault:vault_detail' entry.pk %}" class="btn btn-sm">Открыть</a>
        </td>
    </tr>
    {% endfor %}
</tbody>
    </table>
</div>
{% endblock %}
