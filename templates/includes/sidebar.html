{% load static %}
<aside class="sidebar">
    <!-- 🔹 Заголовок — всегда виден при скролле -->
    <div class="sidebar-header">
        <h3>📋 Разделы</h3>
    </div>

    <!-- 🔹 Прокручиваемая область меню -->
    <nav class="sidebar-menu">
        <a href="{% url 'vault:dashboard' %}" class="menu-item {% if request.resolver_match.app_name == 'vault' or request.resolver_match.url_name == 'home' %}active{% endif %}">
            <span class="icon">🏠</span> Главная
        </a>

        <a href="{% url 'groups:dashboard' %}" class="menu-item {% if request.resolver_match.app_name == 'groups' %}active{% endif %}">
             <span class="icon">👥</span> Группы
        </a>

        <a href="{% url 'students:dashboard' %}" class="menu-item {% if request.resolver_match.app_name == 'students' %}active{% endif %}">
            <span class="icon">🎓</span> Учащиеся
        </a>

        <a href="{% url 'groups:credits_exams' %}" class="menu-item {% if request.resolver_match.url_name == 'credits_exams' or request.resolver_match.url_name == 'credits_exams_add' %}active{% endif %}">
            <span class="icon">✅</span> Зачёты и экзамены
        </a>

        <!-- 🔹 НОВЫЙ ПУНКТ: Отчёты (исправленный стиль) -->
        <a href="{% url 'reports:dashboard' %}" class="menu-item {% if request.resolver_match.app_name == 'reports' %}active{% endif %}">
            <span class="icon">📊</span> Отчёты
        </a>

        <a href="{% url 'classrooms:classroom_list' %}" class="menu-item {% if request.resolver_match.app_name == 'classrooms' %}active{% endif %}">
            <span class="icon">🏫</span> Аудитории
        </a>

        <a href="{% url 'teachers:teacher_list' %}" class="menu-item {% if request.resolver_match.app_name == 'teachers' %}active{% endif %}">
            <span class="icon">📚</span> Преподаватели
        </a>

        <a href="{% url 'masters:master_list' %}" class="menu-item {% if request.resolver_match.app_name == 'masters' %}active{% endif %}">
            <span class="icon">🚗</span> Мастера
        </a>

        <a href="#" class="menu-item">
            <span class="icon">🚙</span> Автопарк
        </a>

        <!-- Разделитель -->
        <div class="menu-divider"></div>

        <a href="{% url 'vault:vault_list' %}" class="menu-item">
            <span class="icon">🔐</span> Хранилище
        </a>
        <a href="{% url 'admin:index' %}" class="menu-item">
            <span class="icon">⚙️</span> Админка
        </a>
    </nav>

    <!-- 🔹 Блок пользователя — всегда внизу -->
    <div class="sidebar-footer">
        <div class="user-info">
            👤 {{ user.get_full_name|default:user.username }}
            <a href="{% url 'admin:logout' %}?next={% url 'home' %}" class="logout-link">Выйти</a>
        </div>
    </div>
</aside>

<style>
    /* 🔹 Контейнер сайдбара */
    .sidebar {
        width: 280px;
        background: white;
        display: flex;
        flex-direction: column;
        box-shadow: -5px 0 25px rgba(0,0,0,0.1);
        height: 100vh;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    /* 🔹 Заголовок — фиксирован сверху */
    .sidebar-header {
        padding: 20px;
        border-bottom: 2px solid #4facfe;
        background: white;
        z-index: 10;
    }
    .sidebar-header h3 {
        margin: 0;
        color: #333;
        text-align: center;
        font-size: 18px;
    }

    /* 🔹 Прокручиваемое меню */
    .sidebar-menu {
        flex: 1;
        overflow-y: auto;
        padding: 10px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* 🔹 Скроллбар для красоты */
    .sidebar-menu::-webkit-scrollbar { width: 6px; }
    .sidebar-menu::-webkit-scrollbar-track { background: #f1f5f9; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .sidebar-menu::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 🔹 Пункты меню — ЕДИНЫЙ СТИЛЬ */
    .menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: #f8f9fa;
        border-radius: 0 10px 10px 0;
        text-decoration: none;
        color: #333;
        font-weight: 500;
        transition: all 0.2s;
        margin: 0 10px;
        border-left: 4px solid transparent;
    }
    .menu-item:hover {
        background: #e3f2fd;
        border-left-color: #4facfe;
        transform: translateX(-3px);
    }
    .menu-item.active {
        background: #e3f2fd;
        border-left-color: #4facfe;
        color: #4facfe;
        font-weight: 600;
    }
    .menu-item .icon {
        font-size: 20px;
        width: 24px;
        text-align: center;
    }

    /* 🔹 Разделитель */
    .menu-divider {
        height: 1px;
        background: #e2e8f0;
        margin: 10px 20px;
    }

    /* 🔹 Футер — фиксирован снизу */
    .sidebar-footer {
        padding: 15px 20px;
        border-top: 1px solid #e2e8f0;
        background: white;
    }
    .user-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        color: #64748b;
    }
    .logout-link {
        color: #4facfe;
        text-decoration: none;
        font-weight: 600;
    }
    .logout-link:hover { text-decoration: underline; }

    /* 🔹 Адаптив для мобильных */
    @media (max-width: 768px) {
        .sidebar {
            width: 100%;
            height: auto;
            position: relative;
            flex-direction: row;
            overflow-x: auto;
            padding: 10px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
        }
        .sidebar-header, .sidebar-footer { display: none; }
        .sidebar-menu {
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            gap: 8px;
        }
        .menu-item {
            flex-shrink: 0;
            margin: 0;
            border-radius: 10px;
            border-left: none;
            border-bottom: 4px solid transparent;
            padding: 10px 15px;
            font-size: 13px;
        }
        .menu-item:hover, .menu-item.active {
            border-left: none;
            border-bottom-color: #4facfe;
            transform: none;
        }
    }
</style>
