{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Автошкола — Панель управления</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* 🔧 Стили специально для дашборда */
        body {
            display: flex;
            flex-direction: row-reverse; /* ✅ Меню СПРАВА */
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        /* Боковое меню */
        .sidebar {
            width: 280px;
            background: white;
            padding: 30px 20px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h3 {
            margin: 0 0 20px 0;
            color: #333;
            text-align: center;
            font-size: 18px;
            border-bottom: 2px solid #4facfe;
            padding-bottom: 15px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .menu-item:hover {
            background: #e3f2fd;
            border-left-color: #4facfe;
            transform: translateX(-3px);
        }

        .menu-item .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .menu-item .badge {
            margin-left: auto;
            background: #4facfe;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .main-content h1 {
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .main-content p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.6;
        }

        .user-info {
            margin-top: 30px;
            padding: 15px 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .logout-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-left: 10px;
        }
        .logout-link:hover { text-decoration: underline; }

        /* Адаптив для мобильных */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding: 15px;
                box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
            }
            .menu-item { flex-shrink: 0; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 🔹 БОКОВОЕ МЕНЮ (СПРАВА) -->

    {% include 'includes/sidebar.html' %}

    <!-- 🔹 ОСНОВНОЙ КОНТЕНТ (СЛЕВА) -->
    <main class="main-content">
        <h1>🚗 Автошкола</h1>
        <p>Панель управления учебным процессом.<br>Выберите раздел в меню справа для начала работы.</p>

        <div class="user-info">
            👤 {{ user.get_full_name|default:user.username }}
            <a href="{% url 'admin:logout' %}?next={% url 'home' %}" class="logout-link">Выйти</a>
        </div>
    </main>

</body>
</html>
